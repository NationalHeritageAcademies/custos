# Throwaway MySQL for local development and the live integration harness.
#   docker compose -f db/docker-compose.yml up -d
# then:
#   npm run test:integration:mysql -w @custos/app
services:
  mysql:
    image: mysql:8.4
    container_name: custos-mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "1"
      MYSQL_DATABASE: shopdb
    ports:
      - "3307:3306"
    volumes:
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 20
