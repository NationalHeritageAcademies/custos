# Throwaway databases for local development and the live integration harnesses.
#   docker compose -f db/docker-compose.yml up -d
# then:
#   npm run test:integration:mysql -w @custos/app
#   npm run test:integration:mongo -w @custos/app
#
# Both use non-default host ports so they cannot collide with a real server you
# already run locally.
services:
  mysql:
    image: mysql:8.4
    container_name: custos-mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "1"
      MYSQL_DATABASE: shopdb
    ports:
      - "3307:3306"
    volumes:
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:8
    container_name: custos-mongo
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 3s
      timeout: 3s
      retries: 20
