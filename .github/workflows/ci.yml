name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  renderer:
    name: Renderer (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      # tokens/client import the shared contract via tsconfig paths, so the
      # backend packages must be present for the renderer type-check.
      - name: Install workspace (for @custos/* sources referenced by tsconfig paths)
        working-directory: .
        run: npm ci
      - run: npm ci
      - run: npm run build
